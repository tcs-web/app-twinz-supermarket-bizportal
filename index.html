<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twinz Supermarket Bizportal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
:root{--bg:#f5f5f5;--card:#fff;--accent:#ff4747;--green:#00b894;--blue:#0984e3;--purple:#6c5ce7;--text:#2d3436;--muted:#636e72;--border:#dfe6e9;--shadow:0 2px 8px rgba(0,0,0,0.1);}
*{box-sizing:border-box;font-family:'Poppins',sans-serif}
body{margin:0;background:var(--bg);color:var(--text)}
.header{background:linear-gradient(90deg,#ff4747,#ff9500);padding:12px;color:#fff;position:sticky;top:0;z-index:99;box-shadow:var(--shadow)}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{width:45px;height:45px;border-radius:10px;background:#fff;padding:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:15px}
.card{background:var(--card);border-radius:12px;padding:10px;box-shadow:var(--shadow)}
.card img{width:100%;height:160px;object-fit:cover;border-radius:8px}
.admin{background:#fff;padding:15px;border-radius:12px;margin:15px;box-shadow:var(--shadow)}
.login-box{max-width:400px;margin:40px auto;background:#fff;padding:25px;border-radius:15px;box-shadow:var(--shadow)}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 15px;border-radius:8px;font-weight:700;cursor:pointer;width:100%}
.btn-purple{background:var(--purple)}
input{width:100%;padding:10px;margin:6px 0;border:1px solid var(--border);border-radius:8px}
.debug{position:fixed;top:0;left:0;background:red;color:#fff;padding:5px;font-size:10px;z-index:9999}
</style>
</head>
<body>
<div id="debug" class="debug">Loading...</div>

<div id="loginScreen">
  <div class="login-box">
    <h2>TWINZ BIZPORTAL</h2>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPass" placeholder="Password">
    <button class="btn" onclick="doLogin()">Login</button>
    <button class="btn btn-purple" onclick="registerUser()" style="margin-top:8px">Create Account</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="header"><div class="header-top"><img src="https://files.catbox.moe/0zympr.jpeg" class="logo"><span id="userRole">ADMIN</span><button class="btn" style="width:auto" onclick="logout()">Logout</button></div></div>
  <div class="admin">
    <button class="btn-purple" onclick="addDemoProducts()">⚡ Add 5 Demo Products</button>
    <input type="text" id="pName" placeholder="Product Name">
    <input type="number" id="pPrice" placeholder="Price R">
    <input type="number" id="pStock" placeholder="Stock Qty">
    <button class="btn" onclick="saveProduct()">Save Product</button>
  </div>
  <h2 style="padding:0 15px">🛒 Products</h2>
  <div class="grid" id="productGrid"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, set, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

const debug = (msg)=>{document.getElementById('debug').innerText = msg}

const firebaseConfig = {
  apiKey: "AIzaSyCKxK7qBOGW4GzhsYxpezgXnNlRODkBA8A",
  authDomain: "app-twinz-supermarket-biz.firebaseapp.com",
  databaseURL: "https://app-twinz-supermarket-biz-default-rtdb.firebaseio.com",
  projectId: "app-twinz-supermarket-biz"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const productsRef = ref(db, 'bizportal/products');
let products = {};

window.doLogin = () => signInWithEmailAndPassword(auth, loginEmail.value, loginPass.value).catch(e=>alert(e.message))
window.registerUser = () => createUserWithEmailAndPassword(auth, loginEmail.value, loginPass.value).then(cred=>set(ref(db, 'bizportal/users/' + cred.user.uid), {email: cred.user.email, role: 'admin'}))
window.logout = () => signOut(auth)

onAuthStateChanged(auth, user => {
  if(user){
    loginScreen.style.display = 'none';
    app.style.display = 'block';
    onValue(ref(db, 'bizportal/users/' + user.uid + '/role'), snap=>{
      let role = snap.val() || 'admin';
      document.getElementById('userRole').innerText = role.toUpperCase();
    })
    // Load products for EVERYONE after login
    onValue(productsRef, snap => {
      products = snap.val() || {};
      debug("Products loaded: " + Object.keys(products).length);
      renderProducts();
    })
  } else {
    loginScreen.style.display = 'block';
    app.style.display = 'none';
  }
})

function renderProducts(){
  productGrid.innerHTML = '';
  if(Object.keys(products).length === 0){
    productGrid.innerHTML = `<p style="text-align:center;grid-column:1/-1">No products. Login as CEO/Manager and click "Add Demo Products"</p>`
    return;
  }
  Object.entries(products).forEach(([id,p])=>{
    productGrid.innerHTML += `<div class="card"><img src="${p.img || 'https://files.catbox.moe/0zympr.jpeg'}"><h4>${p.name}</h4><div style="color:var(--accent);font-weight:800">R${p.price}</div><div style="color:var(--green);font-size:10px">Stock: ${p.stock}</div></div>`;
  })
}

window.saveProduct = () => {
  let id = Date.now().toString();
  set(ref(db, 'bizportal/products/' + id), {
    name:pName.value, price:parseInt(pPrice.value), stock:parseInt(pStock.value), img:"https://files.catbox.moe/0zympr.jpeg"
  });
  pName.value=''; pPrice.value=''; pStock.value='';
}
window.addDemoProducts = () => {
  for(let i=1;i<=5;i++){
    set(ref(db, 'bizportal/products/demo'+i), {name:"Demo Product "+i, price:10*i, stock:20, img:"https://files.catbox.moe/0zympr.jpeg"});
  }
  alert('5 Demo Added - Refresh page')
}
</script>
</body>
</html>
